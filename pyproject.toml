[project]
name = "pynoback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dzmitry Liashko", email = "dzliashko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pynoback = "pynoback:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

ignore = [
    "E501",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true


[tool.mypy]
python_version = "3.14"

strict = true

pretty = true
show_error_codes = true
show_column_numbers = true

warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

files = [
    "src",
    "tests",
]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]


[tool.coverage.run]
branch = true
source = [
    "myapp",
]


[tool.coverage.report]
show_missing = true
skip_covered = true